name: Windows App

on:
  pull_request:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package and packager
        run: python -m pip install . pyinstaller

      - name: Verify Tkinter
        run: python -c "import tkinter; print('tkinter ok')"

      - name: Build single-file Windows app
        run: >
          pyinstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name FirstWindow-Windows-x64
          --paths src
          scripts/firstwindow_gui.py

      - name: Run packaged self-test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\dist\FirstWindow-Windows-x64.exe" -ArgumentList "--self-test" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Packaged self-test failed with exit code $($p.ExitCode)" }

      - name: Run packaged UI language self-test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\dist\FirstWindow-Windows-x64.exe" -ArgumentList "--ui-self-test" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Packaged UI language self-test failed with exit code $($p.ExitCode)" }

      - name: Write SHA256SUMS.txt
        shell: pwsh
        run: |
          $hash = (Get-FileHash ".\dist\FirstWindow-Windows-x64.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  FirstWindow-Windows-x64.exe" | Set-Content ".\dist\SHA256SUMS.txt" -Encoding ascii
          Get-Content ".\dist\SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: FirstWindow-Windows-x64
          path: |
            dist/FirstWindow-Windows-x64.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match package version v$version"
          }

      - name: Publish version tag release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release ${{ github.ref_name }} already exists; refusing to mutate an existing release"
          }
          gh release create "${{ github.ref_name }}" ".\dist\FirstWindow-Windows-x64.exe" ".\dist\SHA256SUMS.txt" --title "FirstWindow ${{ github.ref_name }}" --generate-notes
