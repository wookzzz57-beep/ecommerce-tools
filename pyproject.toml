[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "firstwindow"
version = "0.3.0"
description = "A free-first beginner launcher for coding agents with durable task state and verified completion."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
firstwindow = "firstwindow.cli:main"
firstwindow-gui = "firstwindow.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
